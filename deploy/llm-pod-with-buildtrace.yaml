# A model server pod with buildtrace as a native sidecar (Kubernetes 1.29+).
# The sidecar is the first init container and has restartPolicy: Always, so
# it starts before fetch-weights and records everything the pod downloads
# while it boots: image-less traffic such as weights, pip installs, licence
# checks, telemetry. Read the report with:
#
#   kubectl exec POD -c buildtrace -- /buildtrace show /tmp/buildtrace.json
#
apiVersion: v1
kind: Pod
metadata:
  generateName: llm-traced-
  labels:
    app: llm-traced
spec:
  restartPolicy: Never
  volumes:
    - name: models
      emptyDir: {}
  initContainers:
    - name: buildtrace
      image: ghcr.io/officialasishkumar/buildtrace:latest
      restartPolicy: Always
      args: ["watch", "--json", "/tmp/buildtrace.json", "--every", "5s"]
      securityContext:
        runAsUser: 0
        capabilities: { drop: ["ALL"], add: ["NET_RAW"] }
      resources:
        requests: { cpu: 50m, memory: 64Mi }
        limits: { memory: 128Mi }
    - name: fetch-weights
      image: curlimages/curl:8.11.1
      command: ["curl", "-fsSL", "-o", "/models/model.gguf",
                "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf"]
      volumeMounts:
        - { name: models, mountPath: /models }
  containers:
    - name: server
      image: ghcr.io/ggml-org/llama.cpp:server
      args: ["-m", "/models/model.gguf", "--host", "0.0.0.0", "--port", "8080", "-c", "2048"]
      ports:
        - containerPort: 8080
      readinessProbe:
        httpGet: { path: /health, port: 8080 }
        periodSeconds: 2
      volumeMounts:
        - { name: models, mountPath: /models }
